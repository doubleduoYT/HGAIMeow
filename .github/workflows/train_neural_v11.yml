name: HGAIM v11 Neural-First Training

on:
  push:
    branches:
      - feature/hgaim-v11-neural-first
    paths:
      - train_neural_v11.py
      - train_dialogues_v11.jsonl
      - hgai_core.py
      - evaluate_neural_v11.py
      - .github/workflows/train_neural_v11.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hgaim-v11-neural-first-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check trainer and dialogue format
        run: |
          python -m py_compile hgai_core.py train_v10_quality.py train_neural_v11.py evaluate_neural_v11.py evaluate_bilingual_v10.py evaluate_neural_v10.py
          python build_dataset.py --max-variants 12
          python - <<'PY'
          from train_neural_v11 import dialogue_examples
          rows=dialogue_examples('train_dialogues_v11.jsonl')
          assert len(rows) >= 40
          assert any(history for _,_,history in rows)
          print('v11 dialogue examples:',len(rows))
          PY

      - name: Download v10 Preview 4 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v10.1.0-bilingual-preview.4 --repo "${{ github.repository }}" --pattern hgai_model_v10_preview.pth --dir .
          test -s hgai_model_v10_preview.pth

      - name: Evaluate unmodified v10 checkpoint
        run: |
          python evaluate_neural_v11.py --model-file hgai_model_v10_preview.pth --report V11_BASELINE_DIALOGUE.json

      - name: Train neural-first bilingual continuation
        run: |
          python train_neural_v11.py --preset main --steps 1200 --threads 2 --seed 20261013 --lr 0.00007 --model-file hgai_model_v11.pth --init-model-file hgai_model_v10_preview.pth

      - name: Independent neural evaluation
        run: |
          python evaluate_neural_v11.py --model-file hgai_model_v11.pth --report V11_DIALOGUE_EVAL.json
          python evaluate_neural_v10.py --model-file hgai_model_v11.pth --min-pass 0 --report V11_KO_RAW.json
          python evaluate_bilingual_v10.py --model-file hgai_model_v11.pth --mode raw-neural --min-pass 0 --report V11_EN_RAW.json
          python run_hgai.py --model-file hgai_model_v11.pth --once "안녕!" --mode raw-neural

      - name: Compare baseline and fine-tuned diagnostics
        run: |
          python - <<'PY'
          import json
          b=json.load(open('V11_BASELINE_DIALOGUE.json',encoding='utf8'))
          n=json.load(open('V11_DIALOGUE_EVAL.json',encoding='utf8'))
          for name,s in [('v10 baseline',b),('v11 trained',n)]:
              print(name,'fallback=',s['fallback_dialogues'],'english_with_korean=',s['english_with_korean'])
          print('Metrics are diagnostic. Human evaluation is required before deploying.')
          PY

      - name: Export trained candidate and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgaim-v11-neural-first-${{ github.run_number }}
          path: |
            hgai_model_v11.pth
            hgai_model_v11.training.json
            V11_BASELINE_DIALOGUE.json
            V11_DIALOGUE_EVAL.json
            V11_KO_RAW.json
            V11_EN_RAW.json
          if-no-files-found: warn
          retention-days: 30
