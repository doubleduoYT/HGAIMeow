name: Dispatch HGAI v10 Preview Release

permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - "RELEASE_PREVIEW_TRIGGER.txt"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preview build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release_preview.yml --repo "${{ github.repository }}" --ref main
